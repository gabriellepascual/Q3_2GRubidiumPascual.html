<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q3 3rd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="Gabrielle Pascual">
    <title>Sign Up Form</title>
  <style>
    body {
        background-color: #2b0d0d;
        font-family: 'Poppins', sans-serif;
        color: #f0e6e6;
        margin: 0;
        padding: 40px 0;
        text-align: center;
    }

    h1 {
        font-family: 'Orbitron', sans-serif;
        color: #e63946;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 25px;
        text-shadow: 3px 3px #1a0000;
    }

    form {
        width: 680px;
        margin: auto;
        background-color: #3d0c0c;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
        border: 2px solid #4d0000;
    }

    fieldset {
        border: 2px solid #732626;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
    }

    legend {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.8rem;
        color: #ffb3b3;
        padding: 0 10px;
        text-shadow: 2px 2px #400000;
    }

    label {
        display: block;
        text-align: left;
        margin-bottom: 15px;
        font-size: 0.95rem;
    }

    input, select, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        background-color: #661919;
        border: 2px solid #4d0000;
        border-radius: 8px;
        color: #f5e6e6;
        font-family: 'Poppins', sans-serif;
    }

    textarea {
        resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #e63946;
        background-color: #732626;
        box-shadow: 0 0 8px rgba(230,57,70,0.7);
    }

    .invalid {
        border-color: #ff4d4d;
        background-color: #800000;
    }

    .radio-group {
        display: flex;
        gap: 25px;
        margin-top: 8px;
    }

    .radio-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 0;
        cursor: pointer;
    }

    .radio-group input {
        width: auto;
        margin: 0;
    }

    .buttons {
        text-align: center;
        margin-top: 15px;
    }

    button {
        background-color: #800000;
        color: #fceaea;
        border: 2px solid #4d0000;
        border-radius: 10px;
        padding: 10px 20px;
        margin: 5px;
        font-family: 'Poppins', sans-serif;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.3s ease;
    }

    button:hover {
        background-color: #e63946;
        transform: scale(1.05);
    }
  </style>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("dForm");
    const resetBtn = document.querySelector("button[type='reset']");
    const viewBtn = document.getElementById("view");

    form.addEventListener("submit", function (event) {
        if (!confirm("Are you sure you want to submit this form?")) {
            event.preventDefault();
            return;
        }

        let signupString = localStorage.getItem("clubsignups");
        let signupsList = signupString ? JSON.parse(signupString) : {};

        let sid = document.getElementById("sid").value;

        signupsList[sid] = {
            fname: document.getElementById("fname").value,
            grade: document.querySelector("select[name='grade']").value,
            semail: document.getElementById("semail").value,
            phone: document.getElementById("phone").value,
            inex: document.querySelector("input[name='inex']:checked") ? 
                  document.querySelector("input[name='inex']:checked").value : "",
            clubs: document.querySelector("select[name='clubs']").value
        };

        localStorage.setItem("clubsignups", JSON.stringify(signupsList));
    });

    resetBtn.addEventListener("click", function (event) {
        if (!confirm("Are you sure you want to reset all information?")) {
            event.preventDefault();
        }
    });

    viewBtn.addEventListener("click", function () {
        window.location.href = "viewSignUps.html";
    });

    const inputs = document.querySelectorAll("input[required], textarea[required]");
    inputs.forEach(function (input) {
        input.addEventListener("blur", function () {
            if (input.value.trim() === "") {
                input.classList.add("invalid");
            } else {
                input.classList.remove("invalid");
            }
        });
    });

});
</script>
  </head>
  <body>
    <section>
      <h1 class="title">Sign-up Page <br/>
        <button type="button" id="view"> View Sign-Ups </button>
      </h1>
      <form id="dForm" method="get">
        <fieldset>
          <legend>Your Information</legend>
          <label> Student ID: 
            <input onfocus="changeColor(this)" onblur="resetColor(this)" type="text" name="sid" id="sid" required />
          </label>
          <label> FullName :
            <input onfocus="changeColor(this)" onblur="resetColor(this)" type="text" name="fname" id="fname" required />
          </label>
          <label> Date Of Birth :
            <input type="date" name="dob" id="dob" />
          </label>
          <label> Email :
            <input onfocus="changeColor(this)" onblur="resetColor(this)" type="email" name="semail" id="semail" required />
          </label>
          <label> Mobile Phone :
            <input onfocus="changeColor(this)" onblur="resetColor(this)" type="text" name="phone" id="phone" pattern="[0-9]{11}" placeholder="Type in your 11 digit Mobile Phone Number" required />
          </label>
          <label> Select Your Grade Level
            <select name="grade">
              <option disabled selected value> -- select an option -- </option>
              <option value="Grade 7"> Grade 7 </option>
              <option value="Grade 8"> Grade 8 </option>
              <option value="Grade 9"> Grade 9 </option>
              <option value="Grade 10"> Grade 10 </option>
              <option value="Grade 11"> Grade 11 </option>
              <option value="Grade 12"> Grade 12 </option>
            </select>
          </label>
          <label>Intern / Extern:
            <div class="radio-group">
              <label>
                <input type="radio" name="inex" value="Intern" /> Intern
              </label>
              <label>
                <input type="radio" name="inex" value="Extern" /> Extern
              </label>
            </div>
          </label>
          <label> Select Your Club
            <select name="clubs">
              <option disabled selected value> -- select an option -- </option>
              <option value="Math Club"> Math Club </option>
              <option value="Atom"> Atom </option>
              <option value="Exposure"> Exposure </option>
              <option value="Karyo Biomedical Society"> Karyo Biomedical Society </option>
              <option value="PYHS"> PYHS </option>
            </select>
          </label>
          <label> Why do you want to join : 
            <textarea name="about" id="about"></textarea>
          </label>
        </fieldset>  
        <fieldset>
          <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
          </div>
        </fieldset> 
      </form>
    </section>
  </body>
</html>
